name: Probe NVIDIA synthetic chemistry dataset (metadata only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-nvidia-chemistry.yml"
      - "scripts/probe-nvidia-chemistry.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node scripts/probe-nvidia-chemistry.mjs
