name: Inspect licensed Radical Learn polarity-match schema
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/radical-match-probe.yml"
      - "scripts/probe-radical-matches.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/probe-radical-matches.mjs
