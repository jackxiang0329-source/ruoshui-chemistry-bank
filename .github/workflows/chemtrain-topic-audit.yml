name: Audit reusable licensed ChemTrain question categories
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chemtrain-topic-audit.yml"
      - "scripts/audit-chemtrain-daily-topics.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/audit-chemtrain-daily-topics.mjs
