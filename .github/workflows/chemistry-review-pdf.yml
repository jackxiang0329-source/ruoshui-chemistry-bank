name: Build chemistry Chinese science review PDF
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chemistry-review-pdf.yml"
      - "scripts/build-chemistry-source-tex.mjs"
      - "tests/chemistry-source-tex.test.mjs"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chemistry-source-review-pdf
  cancel-in-progress: false
jobs:
  review-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pinned repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify no unlicensed source content can be promoted
        run: node --test tests/chemistry-source-tex.test.mjs
      - name: Generate provenance-locked Chinese TeX source
        run: node scripts/build-chemistry-source-tex.mjs
      - name: Install XeLaTeX and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-chinese texlive-latex-recommended \
            fonts-noto-cjk fonts-dejavu-core poppler-utils
      - name: Compile two passes for Chinese contents and source citations
        run: |
          set -euo pipefail
          cd external_sources/openstax_chemistry/reports
          xelatex -interaction=nonstopmode -file-line-error -halt-on-error chemistry_source_science_audit.tex
          xelatex -interaction=nonstopmode -file-line-error -halt-on-error chemistry_source_science_audit.tex
          test -s chemistry_source_science_audit.pdf
          test "$(stat -c%s chemistry_source_science_audit.pdf)" -gt 25000
          pdfinfo chemistry_source_science_audit.pdf | grep -E "^(Pages|Page size):"
          pdftotext chemistry_source_science_audit.pdf /tmp/chemistry-source-science-audit.txt
          grep -q "大学化学" /tmp/chemistry-source-science-audit.txt
      - name: Upload Chinese TeX and PDF as reviewer-only artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-42-source-science-review-zh
          path: |
            external_sources/openstax_chemistry/reports/chemistry_source_science_audit.tex
            external_sources/openstax_chemistry/reports/chemistry_source_science_audit.pdf
          if-no-files-found: error
      - name: Commit versioned printable source and PDF to quarantine archive
        run: |
          set -euo pipefail
          git add -f -- external_sources/openstax_chemistry/reports/chemistry_source_science_audit.tex \
            external_sources/openstax_chemistry/reports/chemistry_source_science_audit.pdf
          if git diff --cached --quiet; then
            echo "No changed research review output"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(chemistry): compile rights-blocked Chinese science review PDF [skip ci]"
          git fetch --no-tags origin main
          git rebase origin/main
          git push origin HEAD:main
