name: NVIDIA chemistry research QA intake (5 min)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chemistry-rqa-intake.yml"
      - "scripts/stage-nvidia-rqa.mjs"
      - "tests/stage-nvidia-rqa.test.mjs"
      - "scripts/triage-nvidia-rqa.mjs"
      - "tests/triage-nvidia-rqa.test.mjs"
      - "harvest/pinned_nvidia_science_rqa.json"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chemistry-harvest-main
  cancel-in-progress: false
  queue: max
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Sync current main and state
        run: |
          git fetch --no-tags origin main
          git checkout main
          git reset --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify license-guarded quarantine transformations
        run: node --test tests/stage-nvidia-rqa.test.mjs
      - name: Validate reviewer prioritization
        run: node --test tests/triage-nvidia-rqa.test.mjs
      - name: Pull up to 1600 pinned CC BY chemistry RQA rows into gzip research quarantine
        run: node scripts/stage-nvidia-rqa.mjs
      - name: Rebuild human QA scientific review shortlist
        run: node scripts/triage-nvidia-rqa.mjs
      - name: Commit only genuine newly staged research records
        run: |
          if [ -f harvest/nvidia_rqa_state.json ]; then git add -- harvest/nvidia_rqa_state.json; fi
          if [ -f harvest/nvidia_rqa_review_queue.json ]; then git add -- harvest/nvidia_rqa_review_queue.json; fi
          if [ -d data/research_quarantine/nvidia-rqa ]; then
            git add -- data/research_quarantine/nvidia-rqa
          fi
          if git diff --cached --quiet; then
            echo "No new staged chemistry QAs or cursor changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(chemistry): stage new synthetic RQA for expert review [skip ci]"
          git fetch --no-tags origin main
          git rebase origin/main
          git push origin HEAD:main
