name: Integrated chemistry challenge QA
on:
  push:
    paths:
      - 'data/integrated_challenges/**'
      - 'scripts/check-integrated-challenges.mjs'
      - '.github/workflows/integrated-chemistry-qa.yml'
  pull_request:
    paths:
      - 'data/integrated_challenges/**'
      - 'scripts/check-integrated-challenges.mjs'
  workflow_dispatch:

jobs:
  challenge-batch-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact 200 problems, nonduplicate model pairings, solutions and calculations
        run: node scripts/check-integrated-challenges.mjs
