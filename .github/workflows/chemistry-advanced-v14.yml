name: Chemistry fourteenth-series full numeric QA
on:
  push:
    branches: [main]
    paths:
      - 'editorial/advanced_integrated_v14/**'
      - 'scripts/check-advanced-authored-v14.mjs'
      - '.github/workflows/chemistry-advanced-v14.yml'
  pull_request:
    paths:
      - 'editorial/advanced_integrated_v14/**'
      - 'scripts/check-advanced-authored-v14.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every full numeric vector and draft release flag
        run: node scripts/check-advanced-authored-v14.mjs
