name: Probe pinned Reaction Learn data structure
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-reaction-learn.yml"
      - "scripts/audit-reaction-learn.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/audit-reaction-learn.mjs
