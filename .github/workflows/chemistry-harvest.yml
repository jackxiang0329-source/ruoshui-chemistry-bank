name: Chemistry source harvest (30 min)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chemistry-harvest.yml"
      - "scripts/harvest-chemistry-sources.mjs"
      - "scripts/import-approved-chemistry.mjs"
      - "tests/harvest.test.mjs"
      - "harvest/search_queries.json"
      - "harvest/approved_imports.json"
      - "harvest/approved_generators.json"
      - "scripts/import-chemtrain-tmc.py"
      - "tests/test_chemtrain_tmc_import.py"
      - "scripts/import-chemquiz-reference.mjs"
      - "tests/chemquiz-reference.test.mjs"
      - "scripts/import-chemquiz-organic.mjs"
      - "tests/chemquiz-organic.test.mjs"
      - "scripts/import-chemtrain-radical.mjs"
      - "tests/chemtrain-radical.test.mjs"
      - "scripts/import-chemtrain-photoredox.mjs"
      - "tests/chemtrain-photoredox.test.mjs"
      - "harvest/pinned_photoredox_quenching.json"
      - "third_party/ChemTrain_radical_learn/**"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chemistry-harvest-main
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync the current default branch before harvesting
        run: |
          git fetch --no-tags origin main
          git checkout main
          git reset --hard origin/main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify collector
        run: node --test tests/harvest.test.mjs
      - name: Verify TMC importer without executing upstream code
        run: python3 -m unittest discover -s tests -p "test_chemtrain_tmc_import.py" -v
      - name: Verify MIT chemquiz reference importer
        run: node --test tests/chemquiz-reference.test.mjs
      - name: Verify pinned MIT chemquiz organic practice importer
        run: node --test tests/chemquiz-organic.test.mjs
      - name: Verify pinned Radical Learn source and importer
        run: node --test tests/chemtrain-radical.test.mjs
      - name: Verify pinned Photoredox Learn importer
        run: node --test tests/chemtrain-photoredox.test.mjs
      - name: Search GitHub chemistry repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/harvest-chemistry-sources.mjs
      - name: Import license-approved question records
        run: node scripts/import-approved-chemistry.mjs
      - name: Import pinned CC BY 4.0 TMC Learn complex exercises
        run: python3 scripts/import-chemtrain-tmc.py
      - name: Import pinned MIT chemquiz reference exercises
        run: node scripts/import-chemquiz-reference.mjs
      - name: Import pinned MIT chemquiz organic reference practice
        run: node scripts/import-chemquiz-organic.mjs
      - name: Import CC BY 4.0 Radical Learn text-only organic classification cards
        run: node scripts/import-chemtrain-radical.mjs
      - name: Import pinned CC BY 4.0 Photoredox Learn cycles
        run: node scripts/import-chemtrain-photoredox.mjs
      - name: Commit only real additions or changes
        run: |
          git add -- harvest/source_candidates.json
          if [ -d harvest/import_reports ]; then
            git add -- harvest/import_reports
          fi
          if [ -d harvest/sources ]; then
            git add -- harvest/sources
          fi
          if [ -d data/candidates ]; then
            git add -- data/candidates
          fi
          if git diff --cached --quiet; then
            echo "No new candidates or approved questions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(chemistry): update harvested sources and vetted candidates [skip ci]"
          # Respect any commits that arrived during discovery (never force push).
          git fetch --no-tags origin main
          git rebase origin/main
          git push origin HEAD:main
