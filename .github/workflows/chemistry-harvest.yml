name: Chemistry source harvest (30 min)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chemistry-harvest.yml"
      - "scripts/harvest-chemistry-sources.mjs"
      - "scripts/harvest-public-chemistry.mjs"
      - "tests/harvest-public-chemistry.test.mjs"
      - "harvest/public_dataset_queries.json"
      - "scripts/prioritize-chemistry-sources.mjs"
      - "tests/prioritize-chemistry-sources.test.mjs"
      - "scripts/import-approved-chemistry.mjs"
      - "scripts/import-openstax-chemistry-oer.mjs"
      - "scripts/report-chemistry-coverage.mjs"
      - "scripts/audit-openstax-chemistry-oer.mjs"
      - "scripts/review-openstax-chemistry-numerics.mjs"
      - "scripts/review-openstax-chemistry-numerics-more.mjs"
      - "scripts/build-chemistry-chinese-derivations.mjs"
      - "scripts/build-chemistry-source-tex.mjs"
      - "tests/chemistry-source-tex.test.mjs"
      - "tests/chemistry-chinese-derivations.test.mjs"
      - "tests/review-openstax-chemistry-numerics-more.test.mjs"
      - "scripts/import-curated-openstax-chemistry.mjs"
      - "tests/import-curated-openstax-chemistry.test.mjs"
      - "tests/review-openstax-chemistry-numerics.test.mjs"
      - "tests/audit-openstax-chemistry-oer.test.mjs"
      - "tests/report-chemistry-coverage.test.mjs"
      - "tests/openstax-chemistry-oer.test.mjs"
      - "harvest/pinned_openstax_chemistry.json"
      - "scripts/validate-oer-work-license.mjs"
      - "tests/oer-work-license.test.mjs"
      - "harvest/oer_work_license_review.json"
      - "tests/harvest.test.mjs"
      - "harvest/search_queries.json"
      - "harvest/approved_imports.json"
      - "harvest/approved_generators.json"
      - "scripts/import-chemtrain-tmc.py"
      - "tests/test_chemtrain_tmc_import.py"
      - "scripts/import-chemquiz-reference.mjs"
      - "tests/chemquiz-reference.test.mjs"
      - "scripts/import-chemquiz-organic.mjs"
      - "tests/chemquiz-organic.test.mjs"
      - "scripts/import-chemtrain-radical.mjs"
      - "tests/chemtrain-radical.test.mjs"
      - "scripts/import-chemtrain-radical-matching.mjs"
      - "tests/chemtrain-radical-matching.test.mjs"
      - "scripts/import-chemtrain-photoredox.mjs"
      - "tests/chemtrain-photoredox.test.mjs"
      - "scripts/import-original-physical.mjs"
      - "tests/original-physical.test.mjs"
      - "scripts/import-original-physical-variants.mjs"
      - "tests/original-physical-variants.test.mjs"
      - "scripts/import-dft-course-ez.mjs"
      - "tests/dft-course-ez.test.mjs"
      - "harvest/pinned_dft_course_isomers.json"
      - "scripts/import-chemtrain-pg-learn.mjs"
      - "scripts/import-parametric-mit-chemistry.mjs"
      - "tests/parametric-mit-chemistry.test.mjs"
      - "third_party/parametric-question-engine/**"
      - "tests/chemtrain-pg-learn.test.mjs"
      - "scripts/import-chemtrain-pka-qualitative.mjs"
      - "scripts/import-chemtrain-reactivity.mjs"
      - "tests/chemtrain-reactivity.test.mjs"
      - "scripts/import-qcedu-introqm.mjs"
      - "scripts/audit-candidate-quality.mjs"
      - "scripts/audit-mcq-integrity.mjs"
      - "scripts/build-expert-review-plan.mjs"
      - "scripts/build-publication-index.mjs"
      - "tests/publication-index.test.mjs"
      - "harvest/publication_approvals.json"
      - "tests/expert-review-plan.test.mjs"
      - "tests/mcq-integrity-audit.test.mjs"
      - "scripts/normalize-unpublished-candidates.mjs"
      - "tests/normalize-unpublished-candidates.test.mjs"
      - "tests/muzapro-existing-coverage.test.mjs"
      - "tests/candidate-quality-audit.test.mjs"
      - "scripts/import-original-eis-pyeis.mjs"
      - "tests/original-eis-pyeis.test.mjs"
      - "harvest/pinned_pyeis_original_eis.json"
      - "scripts/import-analytical-calculator-mit.mjs"
      - "tests/analytical-calculator-mit.test.mjs"
      - "scripts/import-original-analytical-variants.mjs"
      - "scripts/import-original-instrumental-analytical.mjs"
      - "scripts/import-original-advanced-physical.mjs"
      - "scripts/import-introqchem-2021.mjs"
      - "tests/introqchem-2021.test.mjs"
      - "harvest/pinned_introqchem_2021.json"
      - "tests/original-advanced-physical.test.mjs"
      - "tests/original-instrumental-analytical.test.mjs"
      - "tests/original-analytical-variants.test.mjs"
      - "harvest/pinned_analytical_calculator_mit.json"
      - "scripts/import-chemtrain-reaction-learn.mjs"
      - "tests/chemtrain-reaction-learn.test.mjs"
      - "scripts/import-chemtrain-daily-text.mjs"
      - "tests/chemtrain-daily-text.test.mjs"
      - "tests/qcedu-introqm.test.mjs"
      - "harvest/pinned_qcedu_introqm.json"
      - "harvest/pinned_reactivity_regioselectivity.json"
      - "tests/chemtrain-pka-qualitative.test.mjs"
      - "harvest/pinned_pka_qualitative_sites.json"
      - "harvest/pinned_pg_learn_deprotection.json"
      - "LICENSE-ORIGINAL-QUESTIONS.md"
      - "harvest/pinned_photoredox_quenching.json"
      - "third_party/ChemTrain_radical_learn/**"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chemistry-harvest-main
  cancel-in-progress: false
  queue: max
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync the current default branch before harvesting
        run: |
          git fetch --no-tags origin main
          git checkout main
          git reset --hard origin/main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify source metadata review prioritization
        run: node --test tests/prioritize-chemistry-sources.test.mjs
      - name: Verify official OER work-level rights registry (no question approval)
        run: node --test tests/oer-work-license.test.mjs
      - name: Verify collector
        run: node --test tests/harvest.test.mjs
      - name: Verify TMC importer without executing upstream code
        run: python3 -m unittest discover -s tests -p "test_chemtrain_tmc_import.py" -v
      - name: Verify MIT chemquiz reference importer
        run: node --test tests/chemquiz-reference.test.mjs
      - name: Verify pinned MIT chemquiz organic practice importer
        run: node --test tests/chemquiz-organic.test.mjs
      - name: Verify pinned Radical Learn source and importer
        run: node --test tests/chemtrain-radical.test.mjs
      - name: Verify original-author licensed 12 radical polarity-matching exercises
        run: node --test tests/chemtrain-radical-matching.test.mjs
      - name: Verify pinned Photoredox Learn importer
        run: node --test tests/chemtrain-photoredox.test.mjs
      - name: Verify original physical chemistry calculations
        run: node --test tests/original-physical.test.mjs
      - name: Verify 72 extended original physical chemistry examples
        run: node --test tests/original-physical-variants.test.mjs
      - name: Test CC BY DFT Course author-table computational chemistry questions
        run: node --test tests/dft-course-ez.test.mjs
      - name: Verify pinned CC BY 4.0 PG Learn importer
        run: node --test tests/chemtrain-pg-learn.test.mjs
      - name: Verify pinned CC BY 4.0 pKa qualitative practice
        run: node --test tests/chemtrain-pka-qualitative.test.mjs
      - name: Verify pinned CC BY 4.0 Reactivity Learn regioselectivity
        run: node --test tests/chemtrain-reactivity.test.mjs
      - name: Verify pinned MIT parametric general chemistry generator
        run: node --test tests/parametric-mit-chemistry.test.mjs
      - name: Verify pinned CC0 QC-Edu quantum chemistry importer
        run: node --test tests/qcedu-introqm.test.mjs
      - name: Verify pinned Reaction Learn licensed-card importer
        run: node --test tests/chemtrain-reaction-learn.test.mjs
      - name: Verify ChemTrain Daily text-only licensed MCQ source
        run: node --test tests/chemtrain-daily-text.test.mjs
      - name: Verify existing MIT Muza quiz coverage and prevent duplicate imports
        run: node --test tests/muzapro-existing-coverage.test.mjs
      - name: Verify candidate review buckets and semantic overlap audit
        run: node --test tests/candidate-quality-audit.test.mjs
      - name: Verify deterministic chemistry expert review sampler
        run: node --test tests/expert-review-plan.test.mjs
      - name: Verify explicit scientific, copyright and LaTeX release gate
        run: node --test tests/publication-index.test.mjs
      - name: Verify MCQ answer key, provenance and publication safeguards
        run: node --test tests/mcq-integrity-audit.test.mjs
      - name: Verify fail-closed publication flag migration
        run: node --test tests/normalize-unpublished-candidates.test.mjs
      - name: Verify pinned MIT analytical chemistry exercise specifications
        run: node --test tests/analytical-calculator-mit.test.mjs
      - name: Verify 96 original analytical parametric exercises
        run: node --test tests/original-analytical-variants.test.mjs
      - name: Verify 64 original instrumental analytical exercises
        run: node --test tests/original-instrumental-analytical.test.mjs
      - name: Verify fixed CC0 course exercise provenance and solution corrections
        run: node --test tests/introqchem-2021.test.mjs
      - name: Verify 48 original advanced physical chemistry calculations
        run: node --test tests/original-advanced-physical.test.mjs
      - name: Verify independently authored EIS physical chemistry exercises
        run: node --test tests/original-eis-pyeis.test.mjs
      - name: Validate public dataset metadata intake safety
        run: node --test tests/harvest-public-chemistry.test.mjs
      - name: Verify eight Chinese source-curated chemistry questions remain strictly unpublished
        run: node --test tests/import-curated-openstax-chemistry.test.mjs
      - name: Verify Chinese source-science XeLaTeX audit is strictly research-only
        run: node --test tests/chemistry-source-tex.test.mjs
      - name: Verify 34 Chinese source-science derivations under fixed rights quarantine
        run: node --test tests/chemistry-chinese-derivations.test.mjs
      - name: Verify additional 22 source-pinned chemistry calculations and explicit license quarantine
        run: node --test tests/review-openstax-chemistry-numerics-more.test.mjs
      - name: Verify independent pinned OpenStax chemistry numerical solutions and answer-key discrepancies
        run: node --test tests/review-openstax-chemistry-numerics.test.mjs
      - name: Verify human-review priority of external OER blocks without publication
        run: node --test tests/audit-openstax-chemistry-oer.test.mjs
      - name: Verify tier-aware chemistry candidate coverage counting
        run: node --test tests/report-chemistry-coverage.test.mjs
      - name: Verify pinned OpenStax chemistry staging, nested exercise parsing and nonpublication
        run: node --test tests/openstax-chemistry-oer.test.mjs
      - name: Stage original OpenStax chemistry chapter exercises for rights and science review
        run: node scripts/import-openstax-chemistry-oer.mjs
      - name: Import license-approved question records
        run: node scripts/import-approved-chemistry.mjs
      - name: Import pinned CC BY 4.0 TMC Learn complex exercises
        run: python3 scripts/import-chemtrain-tmc.py
      - name: Import pinned MIT chemquiz reference exercises
        run: node scripts/import-chemquiz-reference.mjs
      - name: Import pinned MIT chemquiz organic reference practice
        run: node scripts/import-chemquiz-organic.mjs
      - name: Import CC BY 4.0 Radical Learn text-only organic classification cards
        run: node scripts/import-chemtrain-radical.mjs
      - name: Import pinned CC BY text-only organic radical matching exercises
        run: node scripts/import-chemtrain-radical-matching.mjs
      - name: Import pinned CC BY 4.0 Photoredox Learn cycles
        run: node scripts/import-chemtrain-photoredox.mjs
      - name: Generate original CC0 physical chemistry exercises
        run: node scripts/import-original-physical.mjs
      - name: Generate 72 CC0 physical chemistry calculation variants
        run: node scripts/import-original-physical-variants.mjs
      - name: Import 12 CC BY original DFT basis set numerical teaching activities
        run: node scripts/import-dft-course-ez.mjs
      - name: Import pinned CC BY 4.0 PG Learn protecting-group MCQs
        run: node scripts/import-chemtrain-pg-learn.mjs
      - name: Import pinned CC BY 4.0 pKa qualitative comparisons
        run: node scripts/import-chemtrain-pka-qualitative.mjs
      - name: Generate vetted introductory chemistry variants from pinned MIT code
        run: node scripts/import-parametric-mit-chemistry.mjs
      - name: Import pinned CC BY 4.0 Reactivity Learn text-only regioselectivity
        run: node scripts/import-chemtrain-reactivity.mjs
      - name: Import pinned CC0 QC-Edu quantum chemistry exercises
        run: node scripts/import-qcedu-introqm.mjs
      - name: Import pinned CC BY 4.0 Reaction Learn text study cards
        run: node scripts/import-chemtrain-reaction-learn.mjs
      - name: Import pinned ChemTrain Daily MCQs without structure images or measured datasets
        run: node scripts/import-chemtrain-daily-text.mjs
      - name: Import independently validated original analytical chemistry exercises
        run: node scripts/import-analytical-calculator-mit.mjs
      - name: Add 96 independently validated original analytical exercise variants
        run: node scripts/import-original-analytical-variants.mjs
      - name: Stage nine source-linked quantum chemistry course exercises for human review
        run: node scripts/import-introqchem-2021.mjs
      - name: Generate 48 CC0 original advanced physical chemistry exercises
        run: node scripts/import-original-advanced-physical.mjs
      - name: Generate 64 CC0 original instrumental analytical exercises
        run: node scripts/import-original-instrumental-analytical.mjs
      - name: Import pinned Apache-2.0 reference based EIS physics practice
        run: node scripts/import-original-eis-pyeis.mjs
      - name: Normalize missing unreviewed publication flags to false
        run: node scripts/normalize-unpublished-candidates.mjs
      - name: Audit candidate review buckets and potential duplicates
        run: node scripts/audit-candidate-quality.mjs
      - name: Audit MCQ answer key and duplicate upstream source indices
        run: node scripts/audit-mcq-integrity.mjs
      - name: Build fail-closed expert review plan grouped by source and numerical templates
        run: node scripts/build-expert-review-plan.mjs
      - name: Export exclusively manually attested and hash-pinned approved questions
        run: node scripts/build-publication-index.mjs
      - name: Independently recompute curated real OpenStax mole, molarity, acid-base and calorimetry questions
        run: node scripts/review-openstax-chemistry-numerics.mjs
      - name: Append 22 further independent textbook calculations in external quarantine
        run: node scripts/review-openstax-chemistry-numerics-more.mjs
      - name: Build 34 independent Chinese source-computation review notes in external quarantine
        run: node scripts/build-chemistry-chinese-derivations.mjs
      - name: Typeset 42 rights-blocked scientific source reviews in Chinese XeLaTeX
        run: node scripts/build-chemistry-source-tex.mjs
      - name: Quarantine eight Chinese solved OpenStax source exercises until edition rights are resolved
        run: node scripts/import-curated-openstax-chemistry.mjs
      - name: Rank external OpenStax source exercise blocks for manual science and rights review
        run: node scripts/audit-openstax-chemistry-oer.mjs
      - name: Report separate raw OER and main candidate totals without double counting
        run: node scripts/report-chemistry-coverage.mjs
      - name: Commit only real additions or changes
        run: |
          git add -- harvest/source_candidates.json harvest/quality_audit.json harvest/mcq_integrity_audit.json harvest/source_review_queue.json harvest/expert_review_plan.json harvest/coverage_report.json release/chemistry-approved-manifest.json
          if [ -f harvest/external_source_catalog.json ]; then
            git add -- harvest/external_source_catalog.json
          fi
          if [ -d harvest/external_sources ]; then
            git add -- harvest/external_sources
          fi
          if [ -d external_sources/openstax_chemistry ]; then
            git add -- external_sources/openstax_chemistry
          fi
          if [ -d harvest/import_reports ]; then
            git add -- harvest/import_reports
          fi
          if [ -d harvest/sources ]; then
            git add -- harvest/sources
          fi
          if [ -d data/candidates ]; then
            git add -- data/candidates
          fi
          if git diff --cached --quiet; then
            echo "No new candidates or approved questions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(chemistry): update harvested sources and vetted candidates [skip ci]"
          # Respect any commits that arrived during discovery (never force push).
          git fetch --no-tags origin main
          git rebase origin/main
          git push origin HEAD:main
