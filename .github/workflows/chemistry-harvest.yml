name: Chemistry source harvest (30 min)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chemistry-harvest.yml"
      - "scripts/harvest-chemistry-sources.mjs"
      - "scripts/harvest-public-chemistry.mjs"
      - "tests/harvest-public-chemistry.test.mjs"
      - "harvest/public_dataset_queries.json"
      - "scripts/import-approved-chemistry.mjs"
      - "tests/harvest.test.mjs"
      - "harvest/search_queries.json"
      - "harvest/approved_imports.json"
      - "harvest/approved_generators.json"
      - "scripts/import-chemtrain-tmc.py"
      - "tests/test_chemtrain_tmc_import.py"
      - "scripts/import-chemquiz-reference.mjs"
      - "tests/chemquiz-reference.test.mjs"
      - "scripts/import-chemquiz-organic.mjs"
      - "tests/chemquiz-organic.test.mjs"
      - "scripts/import-chemtrain-radical.mjs"
      - "tests/chemtrain-radical.test.mjs"
      - "scripts/import-chemtrain-photoredox.mjs"
      - "tests/chemtrain-photoredox.test.mjs"
      - "scripts/import-original-physical.mjs"
      - "tests/original-physical.test.mjs"
      - "scripts/import-chemtrain-pg-learn.mjs"
      - "scripts/import-parametric-mit-chemistry.mjs"
      - "tests/parametric-mit-chemistry.test.mjs"
      - "third_party/parametric-question-engine/**"
      - "tests/chemtrain-pg-learn.test.mjs"
      - "scripts/import-chemtrain-pka-qualitative.mjs"
      - "scripts/import-chemtrain-reactivity.mjs"
      - "tests/chemtrain-reactivity.test.mjs"
      - "scripts/import-qcedu-introqm.mjs"
      - "scripts/audit-candidate-quality.mjs"
      - "scripts/normalize-unpublished-candidates.mjs"
      - "tests/normalize-unpublished-candidates.test.mjs"
      - "tests/muzapro-existing-coverage.test.mjs"
      - "tests/candidate-quality-audit.test.mjs"
      - "scripts/import-original-eis-pyeis.mjs"
      - "tests/original-eis-pyeis.test.mjs"
      - "harvest/pinned_pyeis_original_eis.json"
      - "scripts/import-analytical-calculator-mit.mjs"
      - "tests/analytical-calculator-mit.test.mjs"
      - "harvest/pinned_analytical_calculator_mit.json"
      - "scripts/import-chemtrain-reaction-learn.mjs"
      - "tests/chemtrain-reaction-learn.test.mjs"
      - "tests/qcedu-introqm.test.mjs"
      - "harvest/pinned_qcedu_introqm.json"
      - "harvest/pinned_reactivity_regioselectivity.json"
      - "tests/chemtrain-pka-qualitative.test.mjs"
      - "harvest/pinned_pka_qualitative_sites.json"
      - "harvest/pinned_pg_learn_deprotection.json"
      - "LICENSE-ORIGINAL-QUESTIONS.md"
      - "harvest/pinned_photoredox_quenching.json"
      - "third_party/ChemTrain_radical_learn/**"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chemistry-harvest-main
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync the current default branch before harvesting
        run: |
          git fetch --no-tags origin main
          git checkout main
          git reset --hard origin/main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify collector
        run: node --test tests/harvest.test.mjs
      - name: Verify TMC importer without executing upstream code
        run: python3 -m unittest discover -s tests -p "test_chemtrain_tmc_import.py" -v
      - name: Verify MIT chemquiz reference importer
        run: node --test tests/chemquiz-reference.test.mjs
      - name: Verify pinned MIT chemquiz organic practice importer
        run: node --test tests/chemquiz-organic.test.mjs
      - name: Verify pinned Radical Learn source and importer
        run: node --test tests/chemtrain-radical.test.mjs
      - name: Verify pinned Photoredox Learn importer
        run: node --test tests/chemtrain-photoredox.test.mjs
      - name: Verify original physical chemistry calculations
        run: node --test tests/original-physical.test.mjs
      - name: Verify pinned CC BY 4.0 PG Learn importer
        run: node --test tests/chemtrain-pg-learn.test.mjs
      - name: Verify pinned CC BY 4.0 pKa qualitative practice
        run: node --test tests/chemtrain-pka-qualitative.test.mjs
      - name: Verify pinned CC BY 4.0 Reactivity Learn regioselectivity
        run: node --test tests/chemtrain-reactivity.test.mjs
      - name: Verify pinned MIT parametric general chemistry generator
        run: node --test tests/parametric-mit-chemistry.test.mjs
      - name: Verify pinned CC0 QC-Edu quantum chemistry importer
        run: node --test tests/qcedu-introqm.test.mjs
      - name: Verify pinned Reaction Learn licensed-card importer
        run: node --test tests/chemtrain-reaction-learn.test.mjs
      - name: Verify existing MIT Muza quiz coverage and prevent duplicate imports
        run: node --test tests/muzapro-existing-coverage.test.mjs
      - name: Verify candidate review buckets and semantic overlap audit
        run: node --test tests/candidate-quality-audit.test.mjs
      - name: Verify fail-closed publication flag migration
        run: node --test tests/normalize-unpublished-candidates.test.mjs
      - name: Verify pinned MIT analytical chemistry exercise specifications
        run: node --test tests/analytical-calculator-mit.test.mjs
      - name: Verify independently authored EIS physical chemistry exercises
        run: node --test tests/original-eis-pyeis.test.mjs
      - name: Validate public dataset metadata intake safety
        run: node --test tests/harvest-public-chemistry.test.mjs
      - name: Discover sources concurrently on GitHub Hugging Face and Zenodo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Search requests are paced independently; no auth bypass or rate-limit evasion.
          node scripts/harvest-chemistry-sources.mjs &
          GITHUB_PID=$!
          node scripts/harvest-public-chemistry.mjs &
          EXTERNAL_PID=$!
          GITHUB_RESULT=0
          EXTERNAL_RESULT=0
          wait "$GITHUB_PID" || GITHUB_RESULT=$?
          wait "$EXTERNAL_PID" || EXTERNAL_RESULT=$?
          if [ "$GITHUB_RESULT" -ne 0 ]; then exit "$GITHUB_RESULT"; fi
          if [ "$EXTERNAL_RESULT" -ne 0 ]; then exit "$EXTERNAL_RESULT"; fi
      - name: Import license-approved question records
        run: node scripts/import-approved-chemistry.mjs
      - name: Import pinned CC BY 4.0 TMC Learn complex exercises
        run: python3 scripts/import-chemtrain-tmc.py
      - name: Import pinned MIT chemquiz reference exercises
        run: node scripts/import-chemquiz-reference.mjs
      - name: Import pinned MIT chemquiz organic reference practice
        run: node scripts/import-chemquiz-organic.mjs
      - name: Import CC BY 4.0 Radical Learn text-only organic classification cards
        run: node scripts/import-chemtrain-radical.mjs
      - name: Import pinned CC BY 4.0 Photoredox Learn cycles
        run: node scripts/import-chemtrain-photoredox.mjs
      - name: Generate original CC0 physical chemistry exercises
        run: node scripts/import-original-physical.mjs
      - name: Import pinned CC BY 4.0 PG Learn protecting-group MCQs
        run: node scripts/import-chemtrain-pg-learn.mjs
      - name: Import pinned CC BY 4.0 pKa qualitative comparisons
        run: node scripts/import-chemtrain-pka-qualitative.mjs
      - name: Generate vetted introductory chemistry variants from pinned MIT code
        run: node scripts/import-parametric-mit-chemistry.mjs
      - name: Import pinned CC BY 4.0 Reactivity Learn text-only regioselectivity
        run: node scripts/import-chemtrain-reactivity.mjs
      - name: Import pinned CC0 QC-Edu quantum chemistry exercises
        run: node scripts/import-qcedu-introqm.mjs
      - name: Import pinned CC BY 4.0 Reaction Learn text study cards
        run: node scripts/import-chemtrain-reaction-learn.mjs
      - name: Import independently validated original analytical chemistry exercises
        run: node scripts/import-analytical-calculator-mit.mjs
      - name: Import pinned Apache-2.0 reference based EIS physics practice
        run: node scripts/import-original-eis-pyeis.mjs
      - name: Normalize missing unreviewed publication flags to false
        run: node scripts/normalize-unpublished-candidates.mjs
      - name: Audit candidate review buckets and potential duplicates
        run: node scripts/audit-candidate-quality.mjs
      - name: Commit only real additions or changes
        run: |
          git add -- harvest/source_candidates.json harvest/quality_audit.json
          if [ -f harvest/external_source_catalog.json ]; then
            git add -- harvest/external_source_catalog.json
          fi
          if [ -d harvest/external_sources ]; then
            git add -- harvest/external_sources
          fi
          if [ -d harvest/import_reports ]; then
            git add -- harvest/import_reports
          fi
          if [ -d harvest/sources ]; then
            git add -- harvest/sources
          fi
          if [ -d data/candidates ]; then
            git add -- data/candidates
          fi
          if git diff --cached --quiet; then
            echo "No new candidates or approved questions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(chemistry): update harvested sources and vetted candidates [skip ci]"
          # Respect any commits that arrived during discovery (never force push).
          git fetch --no-tags origin main
          git rebase origin/main
          git push origin HEAD:main
