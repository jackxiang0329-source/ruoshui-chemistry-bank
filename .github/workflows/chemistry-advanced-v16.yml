name: Chemistry sixteenth-series numerical QA
on:
  push:
    branches: [main]
    paths:
      - 'editorial/advanced_integrated_v16/**'
      - 'scripts/check-advanced-authored-v16.mjs'
      - '.github/workflows/chemistry-advanced-v16.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-advanced-authored-v16.mjs
