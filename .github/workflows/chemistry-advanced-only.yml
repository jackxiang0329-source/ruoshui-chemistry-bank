name: Advanced chemistry only
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce high-level-only candidate policy
        run: node scripts/audit-advanced-only.mjs
      - name: Verify original first-series scientific models
        run: node --test tests/advanced-integrated-12.test.mjs
      - name: Verify second-series scientific models
        run: node scripts/check-advanced-authored-chemistry.mjs
      - name: Verify new third-series scientific models
        run: node scripts/check-advanced-authored-v3.mjs
      - name: Verify the full fifty-case fourth-series scientific audit
        run: node scripts/check-advanced-authored-v4.mjs
      - name: Verify all 50 fifth-series independent chemistry models
        run: node scripts/check-advanced-authored-v5.mjs
      - name: Verify sixth-series 50 provisional cases and required novelty flags
        run: node scripts/check-advanced-authored-v6.mjs
      - name: Verify seventh-series sixty cases with equal four-subject allocation
        run: node scripts/check-advanced-authored-v7.mjs
      - name: Verify eighth-series sixty cases with equal four-subject allocation
        run: node scripts/check-advanced-authored-v8.mjs
      - name: Verify ninth-series one hundred worked problems and numerical witness checks
        run: node scripts/check-advanced-authored-v9.mjs
      - name: Verify ongoing tenth-series complete answer vectors
        run: node scripts/check-advanced-authored-v10.mjs
      - name: Verify eleventh-series full independent answer vectors
        run: node scripts/check-advanced-authored-v11.mjs
