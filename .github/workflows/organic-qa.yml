name: Organic molecular structure QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rdkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'rdkit==2025.9.4'
      - run: python scripts/verify-organic.py
