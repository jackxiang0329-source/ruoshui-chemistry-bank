name: Chemistry eleventh-series independent QA
on:
  push:
    branches: [main]
    paths:
      - 'editorial/advanced_integrated_v11/**'
      - 'scripts/check-advanced-authored-v11.mjs'
      - '.github/workflows/chemistry-advanced-v11.yml'
  pull_request:
    paths:
      - 'editorial/advanced_integrated_v11/**'
      - 'scripts/check-advanced-authored-v11.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every full answer vector and pending-review flags
        run: node scripts/check-advanced-authored-v11.mjs
