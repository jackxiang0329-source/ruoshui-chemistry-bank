name: Inspect licensed ChemTrain Daily embedded data
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-chemtrain-daily.yml"
      - "scripts/inspect-chemtrain-daily.mjs"
      - "scripts/import-chemtrain-daily-text.mjs"
      - "tests/chemtrain-daily-text.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/chemtrain-daily-text.test.mjs
      - run: node scripts/import-chemtrain-daily-text.mjs --dry-run
