name: Fast chemistry source discovery (10 min)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chemistry-discovery-fast.yml"
      - "scripts/harvest-chemistry-sources.mjs"
      - "tests/harvest.test.mjs"
      - "scripts/harvest-public-chemistry.mjs"
      - "scripts/prioritize-external-chemistry-sources.mjs"
      - "tests/prioritize-external-chemistry-sources.test.mjs"
      - "tests/harvest-public-chemistry.test.mjs"
      - "scripts/prioritize-chemistry-sources.mjs"
      - "tests/prioritize-chemistry-sources.test.mjs"
      - "scripts/preflight-chemistry-sources.mjs"
      - "tests/preflight-chemistry-sources.test.mjs"
      - "scripts/inventory-chemistry-question-files.mjs"
      - "tests/inventory-chemistry-question-files.test.mjs"
      - "harvest/search_queries.json"
      - "harvest/public_dataset_queries.json"
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chemistry-harvest-main
  cancel-in-progress: false
  queue: max
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Synchronize latest default branch
        run: |
          git fetch --no-tags origin main
          git checkout main
          git reset --hard origin/main
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source collection and review rules
        run: |
          node --test tests/harvest.test.mjs
          node --test tests/harvest-public-chemistry.test.mjs
          node --test tests/prioritize-external-chemistry-sources.test.mjs
          node --test tests/prioritize-chemistry-sources.test.mjs
          node --test tests/preflight-chemistry-sources.test.mjs
          node --test tests/inventory-chemistry-question-files.test.mjs
      - name: Run two metadata discovery streams concurrently
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHEMISTRY_QUERY_SHARD: auto
          CHEMISTRY_EXTERNAL_SHARD: auto
        run: |
          node scripts/harvest-chemistry-sources.mjs &
          GH_PID=$!
          node scripts/harvest-public-chemistry.mjs &
          EXTERNAL_PID=$!
          GH_RC=0
          EXTERNAL_RC=0
          wait "$GH_PID" || GH_RC=$?
          wait "$EXTERNAL_PID" || EXTERNAL_RC=$?
          if [ "$GH_RC" -ne 0 ]; then
            echo "::error::GitHub discovery failed (exit $GH_RC)"
            exit "$GH_RC"
          fi
          if [ "$EXTERNAL_RC" -ne 0 ]; then
            echo "::error::External discovery failed (exit $EXTERNAL_RC)"
            exit "$EXTERNAL_RC"
          fi
      - name: Rank Hugging Face and Zenodo question-like sources for manual rights review
        run: node scripts/prioritize-external-chemistry-sources.mjs
      - name: Regenerate rights-review priorities (no unapproved question import)
        run: node scripts/prioritize-chemistry-sources.mjs
      - name: Preflight repository LICENSE and README for next 40 sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/preflight-chemistry-sources.mjs
      - name: Identify new licensed-looking repositories that actually contain question and answer files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/inventory-chemistry-question-files.mjs
      - name: Commit only changed source metadata and review queue
        run: |
          git add -- harvest/source_candidates.json harvest/source_review_queue.json harvest/external_review_queue.json
          if [ -f harvest/license_preflight.json ]; then git add -- harvest/license_preflight.json; fi
          if [ -f harvest/content_inventory.json ]; then git add -- harvest/content_inventory.json; fi
          if [ -d harvest/sources ]; then git add -- harvest/sources; fi
          if [ -f harvest/external_source_catalog.json ]; then
            git add -- harvest/external_source_catalog.json
          fi
          if [ -d harvest/external_sources ]; then
            git add -- harvest/external_sources
          fi
          if git diff --cached --quiet; then
            echo "No new unique source records; no changes committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(chemistry): fast discovery metadata [skip ci]"
          git fetch --no-tags origin main
          git rebase origin/main
          git push origin HEAD:main
